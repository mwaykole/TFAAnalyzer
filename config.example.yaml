# ReportPortal Test Failure Analysis Service Configuration
# Copy to config.yaml and update with your values

reportportal:
  # ReportPortal server URL (without trailing slash)
  url: https://reportportal.example.com
  
  # Authentication: Use EITHER token OR username/password
  # Option 1: API token from ReportPortal (Profile -> API Keys)
  token: your-api-token-here
  
  # Option 2: Username and password
  username: your-username
  password: your-password
  
  # Project name in ReportPortal
  project: my_project
  # Verify SSL certificates
  verify_ssl: true

llm:
  # LLM provider (anthropic)
  provider: anthropic
  # Model to use for analysis
  model: claude-sonnet-4-20250514
  # Maximum tokens in response
  max_tokens: 4096
  # Temperature for response generation (lower = more deterministic)
  temperature: 0.1

analysis:
  # Maximum concurrent API requests
  max_concurrent_requests: 5
  # Maximum characters per log chunk (for context window management)
  chunk_size: 150000
  # Minimum confidence threshold for analysis results
  confidence_threshold: 0.7
  # Include fix recommendations in analysis
  include_recommendation: true

logging:
  # Log level: DEBUG, INFO, WARNING, ERROR
  level: INFO
  # Log format: json or console
  format: json

retry:
  # Maximum retry attempts for failed requests
  max_attempts: 3
  # Base delay between retries (seconds)
  base_delay: 1.0
  # Maximum delay between retries (seconds)
  max_delay: 30.0
  # Exponential backoff base
  exponential_base: 2

# Test repository for fetching test source code (improves classification accuracy)
# This allows the analyzer to look at the actual test code to make better decisions
test_repo:
  # Enable test code fetching
  enabled: false
  # GitHub repository containing tests (owner/repo format)
  repo: "red-hat-data-services/ods-ci"
  # Branch to fetch from
  branch: "master"
  # Directory containing tests (relative to repo root)
  test_dir: "ods_ci/tests"
  # Optional: Local path to test repo (faster than GitHub API, useful for development)
  # local_path: /home/user/ods-ci
