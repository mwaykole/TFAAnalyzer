# =============================================================================
# Knowledge Base - Domain-Specific Context for Test Failure Analysis
# =============================================================================
#
# Add your domain knowledge, hints, and context here. These will be
# automatically included in the LLM analysis to improve accuracy.
#
# HOW TO USE:
# -----------
# 1. Add context_hints for general knowledge the LLM should know
# 2. Add quick_rules for immediate pattern-based classification
# 3. Add platform_notes for platform-specific context
#
# The LLM will consider all this information when analyzing failures.
# =============================================================================

# -----------------------------------------------------------------------------
# Context Hints - General domain knowledge for the LLM
# -----------------------------------------------------------------------------
# These are free-form notes that get injected into the LLM prompt.
# Write them as if you're briefing a new QE engineer.

context_hints:
  # ARM Platform
  - context: "ARM architecture tests"
    hint: |
      ARM (aarch64) tests often fail due to missing runtime support.
      Many RHOAI components don't have ARM-compatible images yet.
      ARM failures should usually be classified as SYSTEM ISSUE unless
      there's a clear product bug in the logs.
    keywords:
      - "arm64"
      - "aarch64"
      - "ARM"
      - "linux/arm64"

  # GPU Tests
  - context: "GPU-related tests"
    hint: |
      GPU tests require NVIDIA GPU nodes with proper drivers.
      If no GPU nodes are available, these are SYSTEM ISSUE (infrastructure).
      CUDA errors may indicate driver/hardware issues, not product bugs.
    keywords:
      - "GPU"
      - "CUDA"
      - "nvidia"
      - "gpu-operator"

  # Model Serving Timeouts
  - context: "Model serving startup"
    hint: |
      Large models (LLMs, vLLM, TGI) can take 5-10 minutes to load.
      Short timeouts (<5 min) for these are TEST AUTOMATION issues.
      S3/MinIO credential failures are SYSTEM ISSUE (external service).
    keywords:
      - "vLLM"
      - "TGI"
      - "LLM"
      - "model-mesh"

  # CI Environment
  - context: "CI/CD environment"
    hint: |
      Tests running on CI may hit resource limits or quota issues.
      These should be classified as SYSTEM ISSUE, not product bugs.
      Look for "quota exceeded", "resource limit", "insufficient" patterns.
    keywords:
      - "CI"
      - "Jenkins"
      - "Prow"
      - "GitHub Actions"

# -----------------------------------------------------------------------------
# Quick Rules - Immediate pattern-based classification overrides
# -----------------------------------------------------------------------------
# These patterns, when matched, immediately classify the failure
# without needing LLM analysis. Use for well-known failure patterns.

quick_rules:
  # =============================================================================
  # INFRASTRUCTURE / SYSTEM ISSUES
  # =============================================================================
  
  # ARM platform - no runtime support
  - name: "ARM platform not supported"
    pattern: "linux/arm64.*not.*found|no.*arm64.*image|arm64.*not.*supported"
    classification: "system_issue"
    reason: "ARM architecture not yet supported for this component"
    severity: "low"
    
  # S3 credential issues - always external service
  - name: "S3 authentication failure"
    pattern: "storage-initializer.*exit.*code|InvalidAccessKeyId|AccessDenied.*S3|NoCredentialProviders"
    classification: "system_issue"
    reason: "S3/MinIO credentials misconfigured or expired"
    severity: "high"

  # Pod scheduling/resource issues
  - name: "Pod scheduling failure"
    pattern: "Insufficient.*cpu|Insufficient.*memory|nodes.*didn't.*match|0/\\d+.*nodes.*are.*available"
    classification: "system_issue"
    reason: "Cluster resource constraints - not enough CPU/memory/nodes"
    severity: "high"
    
  - name: "Image pull failure"
    pattern: "ImagePullBackOff|ErrImagePull|Failed to pull image|repository.*not found|unauthorized.*authentication"
    classification: "system_issue"
    reason: "Container image unavailable or registry authentication failed"
    severity: "high"

  - name: "GPU not available"
    pattern: "nvidia.com/gpu.*Insufficient|no.*GPU.*available|CUDA.*not.*found|nvidia-smi.*failed"
    classification: "system_issue"
    reason: "GPU resources not available on cluster"
    severity: "medium"

  - name: "Network/DNS failure"
    pattern: "no.*such.*host|connection.*refused|dial.*tcp.*timeout|DNS.*lookup.*failed"
    classification: "system_issue"
    reason: "Network connectivity or DNS resolution failure"
    severity: "high"

  - name: "OOM Killed"
    pattern: "OOMKilled|Out.*Of.*Memory|memory.*limit.*exceeded|killed.*signal.*9"
    classification: "system_issue"
    reason: "Container killed due to memory limit - may need higher limits"
    severity: "high"

  - name: "HuggingFace access"
    pattern: "huggingface.*401|HF_ACCESS_TOKEN|gated.*repo.*access|Cannot.*access.*gated"
    classification: "system_issue"
    reason: "HuggingFace token missing or insufficient permissions for gated model"
    severity: "medium"

  # =============================================================================
  # POD/CONTAINER FAILURES (Need deeper analysis)
  # =============================================================================

  - name: "CrashLoopBackOff"
    pattern: "CrashLoopBackOff|container.*crash|exit.*code.*[1-9]|BackOff.*restarting"
    classification: "needs_investigation"
    reason: "Container crashing - check pod logs for root cause"
    severity: "high"
    additional_context: "Fetch pod logs and events for actual error"

  # =============================================================================
  # TEST AUTOMATION ISSUES
  # =============================================================================
  
  # Dashboard/UI flakiness
  - name: "UI element issues"
    pattern: "StaleElementReference|ElementNotInteractable|element.*not.*clickable|NoSuchElement"
    classification: "automation_bug"
    reason: "UI test race condition - element state changed during interaction"
    severity: "medium"

  # Setup-phase timeout on K8s resource readiness
  - name: "Setup phase timeout on wait_for_condition"
    pattern: "failed on setup.*TimeoutExpiredError.*wait_for_condition"
    classification: "Infrastructure Issue"
    reason: "Test failed in setup waiting for K8s resource condition — platform resource not ready"
    severity: "high"
    additional_context: "Check must-gather for unhealthy pods, operator status, and resource failures"

  # Timeout issues from test framework
  - name: "TimeoutExpiredError from test"
    pattern: "TimeoutExpiredError.*wait_timeout|TimeoutSampler.*exceeded|polling.*timeout"
    classification: "needs_investigation"
    reason: "Test timeout - could be slow resource creation or actual hang"
    severity: "medium"
    additional_context: "Check if timeout is reasonable for the operation"

  # RBAC propagation delay
  - name: "RBAC propagation delay"
    pattern: "UnauthorizedException.*403|Forbidden.*RBAC|User.*cannot.*get|permission.*denied.*RBAC"
    classification: "automation_bug"
    reason: "RBAC role not yet propagated - test needs longer wait"
    severity: "low"

  # Assert failures with clear patterns
  - name: "Resource count mismatch"
    pattern: "UnexpectedResourceCountError|expected.*\\d+.*got.*\\d+|len\\(.*\\).*!=|assert.*count"
    classification: "needs_investigation"
    reason: "Resource count doesn't match expected - check for cleanup or creation issues"
    severity: "medium"

  # =============================================================================
  # PRODUCT BUGS (High confidence patterns)
  # =============================================================================

  - name: "Operator reconciliation failure"
    pattern: "reconcile.*error|controller.*failed|operator.*panic|CRD.*validation.*failed"
    classification: "product_bug"
    reason: "Operator failed to reconcile resource - likely a product bug"
    severity: "high"

  - name: "Missing CRD dependency"
    pattern: "no matches for kind|no match for kind|CRD.*not.*installed|resource.*not.*found.*in.*group"
    classification: "product_bug"
    reason: "Required CRD not installed on cluster - component dependency missing"
    severity: "critical"

  - name: "LeaderWorkerSet CRD missing"
    pattern: "LeaderWorkerSet.*not.*found|no matches.*LeaderWorkerSet|failed.*expected.*LWS"
    classification: "product_bug"
    reason: "LeaderWorkerSet CRD not installed - required for LLMD multi-node inference"
    severity: "critical"

  - name: "LLMD reconciliation failure"
    pattern: "failed to reconcile.*workload|failed to build.*expected.*LWS|llminferenceservice.*failed"
    classification: "product_bug"
    reason: "LLMD operator failed to reconcile - check CR status conditions for details"
    severity: "high"

  - name: "KServe InferenceService failure"
    pattern: "InferenceService.*not.*[Rr]eady|InferenceService.*[Ff]ailed|isvc.*not.*ready"
    classification: "product_bug"
    reason: "InferenceService failed to become ready - check ISVC status conditions and predictor pod"
    severity: "high"

  - name: "KServe revision failure"
    pattern: "RevisionFailed|LatestCreatedRevision.*not.*[Rr]eady|revision.*failed"
    classification: "product_bug"
    reason: "Knative revision failed - model container crashed during startup"
    severity: "high"

  - name: "ServingRuntime misconfigured"
    pattern: "ServingRuntime.*not.*found|runtime.*not.*supported|ClusterServingRuntime.*missing"
    classification: "product_bug"
    reason: "ServingRuntime not found or misconfigured for model format"
    severity: "high"

  - name: "Model storage initializer failure"
    pattern: "storage-initializer.*failed|storage-initializer.*exit.*code|failed.*download.*model"
    classification: "system_issue"
    reason: "Model download failed - check S3/storage credentials and bucket access"
    severity: "high"

  - name: "Knative/Istio ingress not configured"
    pattern: "IngressNotConfigured|ingress.*not.*ready|gateway.*not.*found"
    classification: "system_issue"
    reason: "Knative serving or Istio ingress not configured - service mesh issue"
    severity: "high"

  - name: "API server error"
    pattern: "500.*Internal.*Server.*Error|503.*Service.*Unavailable|api.*server.*error"
    classification: "product_bug"
    reason: "API returning server error - product bug"
    severity: "high"

  - name: "Model inference error"
    pattern: "inference.*failed|prediction.*error|model.*output.*invalid|RuntimeError.*model"
    classification: "product_bug"
    reason: "Model inference returned error - check model or serving runtime"
    severity: "high"

  # =============================================================================
  # FLAKY TEST INDICATORS
  # =============================================================================

  - name: "Flaky - timing dependent"
    pattern: "time\\.sleep|wait_for.*timeout|eventually.*should|retry.*attempts.*exhausted"
    classification: "flaky_candidate"
    reason: "Test uses timing-dependent patterns - potential flakiness"
    severity: "low"
    
  - name: "Flaky - resource race"
    pattern: "ResourceNotFoundError.*after.*create|resource.*not.*ready|still.*pending"
    classification: "flaky_candidate"
    reason: "Resource not ready when expected - timing issue"
    severity: "medium"

# -----------------------------------------------------------------------------
# Platform-Specific Notes
# -----------------------------------------------------------------------------
# Add notes for specific platforms, clusters, or environments

platform_notes:
  arm64:
    status: "limited_support"
    note: "ARM platform has limited runtime support. Most failures are expected."
    default_classification: "system_issue"
    
  gpu:
    status: "requires_hardware"
    note: "Requires NVIDIA GPU nodes. Check cluster has GPU capacity."
    
  fips:
    status: "compliance_mode"
    note: "FIPS mode may cause crypto-related test failures due to algorithm restrictions."

# -----------------------------------------------------------------------------
# Component-Specific Context
# -----------------------------------------------------------------------------
# Additional context for specific test components
# Based on analysis of opendatahub-tests repository structure

component_context:
  Model_server:
    notes:
      - "Large models (vLLM, TGI, LLMs) can take 5-15 min to load"
      - "S3/MinIO issues are SYSTEM ISSUE, not product bugs"
      - "vLLM/TGI require significant memory (8-16GB+)"
      - "GPU tests require NVIDIA nodes with proper drivers"
      - "Check for HuggingFace token issues with gated models"
    timeout_expectations:
      model_load: "5-15 minutes for LLMs, 1-2 min for small models"
      inference: "30 seconds for most models, 2-5 min for large LLMs"
      pod_ready: "2-5 minutes typically"
    common_failures:
      - pattern: "storage-initializer"
        likely_cause: "S3 credentials or bucket access"
      - pattern: "OOMKilled"
        likely_cause: "Model too large for container memory limit"
      - pattern: "CrashLoopBackOff"
        likely_cause: "Check pod logs - often missing GPU or config error"
      
  Dashboard:
    notes:
      - "UI tests are inherently flaky - timing dependent"
      - "StaleElement errors are usually test automation issues"
      - "ElementNotInteractable usually means element not visible yet"
      - "Consider explicit waits over implicit waits"
    common_failures:
      - pattern: "StaleElementReference"
        likely_cause: "DOM changed during test - need better waits"
      - pattern: "timeout.*click"
        likely_cause: "Element not clickable in time - loading issue"
      
  Pipelines:
    notes:
      - "DSP v2 uses Argo workflows, v1 used Tekton"
      - "Artifact storage issues are SYSTEM ISSUE"
      - "Pipeline runs can take 5-30 minutes"
    timeout_expectations:
      pipeline_run: "5-30 minutes depending on complexity"
      artifact_upload: "1-5 minutes"

  model_registry:
    notes:
      - "Requires MariaDB or PostgreSQL backend"
      - "Database connection issues are SYSTEM ISSUE"
      - "Model catalog API may take 30-60s to become ready"
    common_failures:
      - pattern: "mariadb.*connection"
        likely_cause: "Database not ready or credentials wrong"
      - pattern: "model_catalog_api.*timeout"
        likely_cause: "API server startup slow - increase wait"

  kserve:
    notes:
      - "Supports Serverless (Knative) and RawDeployment modes"
      - "Serverless mode requires Knative serving installed"
      - "InferenceService creation can take 2-10 minutes"
      - "Check Predictor, Transformer, Explainer pod statuses separately"
      - "IMPORTANT: When ISVC times out, check .status.conditions for the REAL error"
      - "Resource hierarchy: ISVC -> Predictor -> Revision/Deployment -> Pod -> Containers"
      - "Key containers: storage-initializer (downloads model), kserve-container (runs inference), queue-proxy (Knative)"
    deployment_modes:
      serverless: "Knative-based, scales to zero, slower cold starts"
      raw_deployment: "Direct deployment, faster startup, no scale-to-zero"
      modelmesh: "Multi-model serving, shared runtime pods"
    timeout_expectations:
      isvc_ready: "2-10 minutes depending on model size"
      cold_start: "30s-5min for serverless cold starts"
      model_download: "1-10 minutes depending on model size and S3 bandwidth"
    cr_status_checks:
      - condition: "Ready=False"
        meaning: "ISVC not serving - check sub-conditions for why"
      - condition: "PredictorReady=False"
        meaning: "Predictor pod not running - check pod events"
      - condition: "IngressReady=False"
        meaning: "Knative route or Istio ingress misconfigured"
      - condition: "LatestCreatedRevisionReady=False"
        meaning: "Container failed to start - check kserve-container logs"
    common_failures:
      - pattern: "RevisionFailed"
        likely_cause: "Model container crashed - check kserve-container logs for OOM, model format, or config error"
      - pattern: "storage-initializer.*exit"
        likely_cause: "S3 credentials wrong, bucket not found, or model path incorrect"
      - pattern: "IngressNotConfigured"
        likely_cause: "Knative serving or Istio not properly installed"

  llmd:
    notes:
      - "LLM Distributed (LLMD) for multi-node LLM inference"
      - "Uses LLMInferenceService CRD (not standard InferenceService)"
      - "Requires LeaderWorkerSet (LWS) CRD as a dependency"
      - "If LWS CRD is missing, LLMD reconciliation fails immediately"
      - "LLMD creates LeaderWorkerSet to manage multi-node pods (leader + workers)"
      - "Check LLMInferenceService .status.conditions for reconciliation errors"
    resource_hierarchy: "LLMInferenceService -> LeaderWorkerSet -> Pods (leader + workers)"
    dependencies:
      - "LeaderWorkerSet CRD (leaderworkerset.x-k8s.io/v1)"
      - "KServe operator"
      - "GPU nodes for each worker"
    common_failures:
      - pattern: "no matches for kind.*LeaderWorkerSet"
        likely_cause: "LWS CRD not installed on cluster - CRITICAL dependency missing"
        classification: "product_bug"
      - pattern: "failed to reconcile multi-node"
        likely_cause: "LLMD controller cannot create worker set - check CR status"
        classification: "product_bug"
      - pattern: "worker.*not.*ready|leader.*not.*ready"
        likely_cause: "Worker/leader pod scheduling or startup failure"
        classification: "system_issue"

  modelmesh:
    notes:
      - "Multi-model serving on shared runtime pods"
      - "Models share ServingRuntime pods"
      - "Check runtime pod logs, not individual model pods"
    common_failures:
      - pattern: "model.*not.*loaded"
        likely_cause: "Runtime pod issue or model format mismatch"

  trustyai:
    notes:
      - "Model explainability service"
      - "Requires TrustyAI operator installed"
      - "May need time to collect inference data before explanations work"

  llama_stack:
    notes:
      - "LlamaStack operator for LLM orchestration"
      - "Requires significant GPU resources"
      - "Long startup times for large models"

  serving_runtimes:
    notes:
      - "ServingRuntime defines which model server to use (vLLM, TGI, Caikit, etc.)"
      - "ClusterServingRuntime is cluster-scoped, ServingRuntime is namespace-scoped"
      - "Runtime must support the model format (ONNX, PyTorch, SafeTensors, etc.)"
      - "Misconfigured runtime = InferenceService stays NotReady"
    common_failures:
      - pattern: "runtime.*not.*found|ServingRuntime.*not.*found"
        likely_cause: "ServingRuntime CR missing or name mismatch in InferenceService spec"
      - pattern: "model.*format.*not.*supported"
        likely_cause: "Runtime does not support this model format"

  rhoai_operators:
    notes:
      - "RHOAI operator manages DataScienceCluster (DSC) and DSCInitialization (DSCI)"
      - "DSC .status.conditions shows which components are Ready/Degraded"
      - "If DSC component is degraded, all tests for that component will fail"
      - "Operator pod in redhat-ods-operator namespace"
      - "Component pods in redhat-ods-applications namespace"
    namespaces:
      operator: "redhat-ods-operator"
      applications: "redhat-ods-applications"
      monitoring: "redhat-ods-monitoring"
      notebooks: "rhods-notebooks"
    common_failures:
      - pattern: "DSC.*not.*ready|DataScienceCluster.*degraded"
        likely_cause: "RHOAI operator failed to reconcile a component"
      - pattern: "component.*degraded|component.*not.*available"
        likely_cause: "Specific RHOAI component not healthy"

  workbenches:
    notes:
      - "Jupyter notebook workbench tests"
      - "Image pull for large workbench images can be slow (10+ min)"
      - "PVC provisioning can cause delays"
    common_failures:
      - pattern: "ImagePullBackOff"
        likely_cause: "Large image, slow registry, or auth issue"
      - pattern: "PVC.*pending"
        likely_cause: "Storage class issue or quota exceeded"

  cluster_health:
    notes:
      - "Pre-flight checks for cluster readiness"
      - "Failures here indicate fundamental cluster issues"
      - "Should block other tests if these fail"
    common_failures:
      - pattern: "operator.*not.*ready"
        likely_cause: "Operator installation incomplete or degraded"
      - pattern: "DSC.*not.*ready"
        likely_cause: "DataScienceCluster resource not reconciled"

# -----------------------------------------------------------------------------
# Team-Specific Overrides
# -----------------------------------------------------------------------------
# Add your team's specific knowledge here

team_overrides:
  # Example: Your team knows certain tests are always flaky
  known_flaky_tests:
    - test_pattern: "test_notebook_spawn.*large_image"
      reason: "Large image pull can exceed default timeout"
      recommended_action: "Increase timeout to 10 minutes"
      
  # Example: Temporarily ignore certain failures
  temporary_ignores:
    - pattern: "RHOAIENG-12345"
      reason: "Known issue being fixed in next release"
      jira: "RHOAIENG-12345"
      expires: "2026-02-01"

# -----------------------------------------------------------------------------
# Timeout Analysis Reference
# -----------------------------------------------------------------------------
# Based on opendatahub-tests/utilities/constants.py
# Helps determine if a timeout failure is test issue vs actual hang

timeout_reference:
  # Standard timeouts from test framework
  constants:
    TIMEOUT_15_SEC: 15
    TIMEOUT_30SEC: 30
    TIMEOUT_1MIN: 60
    TIMEOUT_2MIN: 120
    TIMEOUT_4MIN: 240
    TIMEOUT_5MIN: 300
    TIMEOUT_10MIN: 600
    TIMEOUT_15MIN: 900
    TIMEOUT_20MIN: 1200
    TIMEOUT_30MIN: 1800
    TIMEOUT_40MIN: 2400

  # Expected durations by operation type
  operation_expectations:
    pod_scheduling: "30s-2min (GPU pods may take longer)"
    pod_ready: "1-5min for most, 10min+ for large images"
    model_load_small: "30s-2min"
    model_load_llm: "5-15min for large LLMs"
    inference_request: "1s-30s for most, 2-5min for large LLMs"
    operator_reconcile: "30s-5min"
    rbac_propagation: "5s-2min"
    pvc_provisioning: "30s-5min"
    route_ready: "10s-1min"
    serverless_cold_start: "30s-5min"
    image_pull_small: "10s-1min"
    image_pull_large: "5-15min for multi-GB images"

  # Timeout analysis rules
  analysis_rules:
    - condition: "timeout < expected_min"
      verdict: "Test timeout too short - AUTOMATION ISSUE"
    - condition: "timeout > expected_max * 2"
      verdict: "Timeout excessive, likely actual hang - investigate further"
    - condition: "timeout within expected range but failed"
      verdict: "Could be resource constraints or actual issue"

# -----------------------------------------------------------------------------
# Failure Correlation Patterns
# -----------------------------------------------------------------------------
# Patterns that often occur together (systemic issues)

correlation_patterns:
  cluster_resource_exhaustion:
    indicators:
      - "Insufficient.*cpu"
      - "Insufficient.*memory"
      - "0/\\d+.*nodes.*available"
    interpretation: "Cluster is resource-constrained - multiple tests likely affected"
    recommendation: "Check cluster capacity, may need to scale up or reduce parallel tests"

  storage_issues:
    indicators:
      - "storage-initializer.*failed"
      - "PVC.*Pending"
      - "volume.*mount.*failed"
    interpretation: "Storage subsystem issue - likely affects multiple model serving tests"
    recommendation: "Check storage class, S3 credentials, and PVC provisioner"

  operator_degraded:
    indicators:
      - "operator.*not.*ready"
      - "DSC.*reconcile.*failed"
      - "component.*degraded"
    interpretation: "Operator issue - will cascade to component tests"
    recommendation: "Check operator pods and logs first"

  network_partition:
    indicators:
      - "connection.*refused"
      - "no.*such.*host"
      - "timeout.*dial"
    interpretation: "Network connectivity issue - affects external service access"
    recommendation: "Check DNS, service mesh, and network policies"

  kserve_cr_chain_failure:
    indicators:
      - "InferenceService.*not.*ready"
      - "RevisionFailed"
      - "LatestCreatedRevision.*not.*ready"
      - "failed to reconcile"
    interpretation: "KServe resource chain failure - check ISVC -> Predictor -> Pod status conditions"
    recommendation: "Inspect CR .status.conditions for the actual error message, not just the timeout"

  missing_crd_dependency:
    indicators:
      - "no matches for kind"
      - "CRD.*not.*found"
      - "resource.*not.*registered"
    interpretation: "Required CRD not installed - product dependency missing"
    recommendation: "Check if the required operator/CRD is installed on the cluster"

  model_serving_cascade:
    indicators:
      - "storage-initializer.*failed"
      - "InferenceService.*not.*ready"
      - "model.*not.*loaded"
    interpretation: "Model serving cascade failure - typically starts with model download or runtime issue"
    recommendation: "Check S3 credentials, model path, ServingRuntime configuration"

# -----------------------------------------------------------------------------
# Settings
# -----------------------------------------------------------------------------
settings:
  # Include context hints in LLM prompts
  enabled: true
  
  # Max number of context hints to include (most relevant)
  max_hints_per_analysis: 5
  
  # Apply quick_rules before LLM analysis
  apply_quick_rules: true
  
  # Log when knowledge base is used
  log_usage: true
  
  # Enable timeout analysis
  analyze_timeouts: true
  
  # Enable correlation detection
  detect_correlations: true
