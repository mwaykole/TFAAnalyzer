# =============================================================================
# Test Failure Classification Rules for RHOAI/ODH
# =============================================================================
# Rules for opendatahub-tests: https://github.com/opendatahub-io/opendatahub-tests
#
# Structure:
#   - defect_types: Maps classifications to ReportPortal defect type codes
#   - classifications: Defines each category with rules, patterns, and keywords
#   - severity_rules: Determines severity based on patterns
#   - component_specific_rules: Rules specific to certain components
# =============================================================================

# -----------------------------------------------------------------------------
# ReportPortal Defect Type Mapping
# -----------------------------------------------------------------------------
defect_types:
  product_bug: "pb001"           # Product Bug (red)
  automation_bug: "ab001"        # Automation Bug (yellow)
  system_issue: "si001"          # System Issue (blue) - for infra/external
  no_defect: "nd001"             # No Defect
  to_investigate: "ti001"        # To Investigate (default)

# -----------------------------------------------------------------------------
# Classification Categories
# -----------------------------------------------------------------------------
classifications:

  # ===========================================================================
  # PRODUCT BUG - Real defects in RHOAI/ODH product
  # ===========================================================================
  product_bug:
    description: "Real defect in RHOAI/ODH product that needs fixing"
    priority: 1

    definitive_patterns:
      # Version issues
      - pattern: "version.*mismatch"
        description: "Version mismatch between components"
      - pattern: "expected.*version.*got"
        description: "Wrong version deployed"
      - pattern: "mm_version.*!=.*product_version"
        description: "ModelMesh version mismatch"

      # Pod/Container issues
      - pattern: "CrashLoopBackOff"
        description: "Pod crashing repeatedly"
      - pattern: "OOMKilled"
        description: "Out of memory - needs more resources"
      - pattern: "Error.*container"
        description: "Container error"
      - pattern: "CreateContainerError"
        description: "Failed to create container"

      # Service errors
      - pattern: "status.*code.*5[0-9]{2}"
        description: "Server error (5xx)"
      - pattern: "Internal.*[Ss]erver.*[Ee]rror"
        description: "Internal server error"
      - pattern: "service.*unavailable"
        description: "Service is down"
      - pattern: "endpoint.*not.*found"
        description: "Missing API endpoint"

      # RHOAI/ODH specific
      - pattern: "InferenceService.*Failed"
        description: "Model inference service failed"
      - pattern: "InferenceService.*not.*[Rr]eady"
        description: "Model not ready"
      - pattern: "ModelMesh.*[Ff]ailed"
        description: "ModelMesh failure"
      - pattern: "ServingRuntime.*error"
        description: "Serving runtime error"
      - pattern: "DSC.*not.*[Rr]eady"
        description: "DataScienceCluster not ready"
      - pattern: "DSCI.*not.*[Rr]eady"
        description: "DSCInitialization not ready"
      - pattern: "operator.*reconcile.*failed"
        description: "Operator reconciliation failure"
      - pattern: "Pipeline.*execution.*[Ff]ailed"
        description: "Pipeline execution failure"
      - pattern: "Notebook.*server.*crash"
        description: "Notebook server crashed"
      - pattern: "kernel.*died"
        description: "Jupyter kernel died"

    keywords:
      high_weight:
        - "NullPointerException"
        - "SegmentationFault"
        - "data corruption"
        - "memory leak"
        - "deadlock"
        - "assertion failed"
      medium_weight:
        - "unexpected error"
        - "internal error"
        - "unhandled exception"
        - "component not ready"
        - "unhealthy"
        - "degraded"
      low_weight:
        - "error"
        - "failed"
        - "exception"

  # ===========================================================================
  # TEST AUTOMATION ISSUE - Problems in test code (opendatahub-tests)
  # ===========================================================================
  automation_bug:
    description: "Problem in test code from opendatahub-tests repository"
    priority: 2

    definitive_patterns:
      # Timeout issues (common in opendatahub-tests)
      - pattern: "TimeoutError.*waiting.*metric"
        description: "Test timeout waiting for Prometheus metrics"
        fix: "Increase timeout or adjust for scrape interval"
      - pattern: "TimeoutExpiredError"
        description: "Test timeout too short"
        fix: "Increase wait_timeout value"
      - pattern: "TimeoutSampler.*expired"
        description: "TimeoutSampler polling exhausted"
        fix: "Increase TimeoutSampler wait_timeout"
      - pattern: "Timed out after.*waiting"
        description: "Generic wait timeout"
        fix: "Increase wait time"

      # pytest/fixture issues
      - pattern: "fixture.*not.*found"
        description: "Missing pytest fixture"
        fix: "Add or import the fixture"
      - pattern: "ScopeMismatch"
        description: "Pytest fixture scope issue"
        fix: "Fix fixture scope"
      - pattern: "SetupError"
        description: "Test setup failed"
        fix: "Fix test setup"
      - pattern: "TeardownError"
        description: "Test teardown failed"
        fix: "Fix test cleanup"

      # UI test issues (Selenium/Playwright)
      - pattern: "StaleElementReferenceException"
        description: "UI element became stale"
        fix: "Add wait or refresh element"
      - pattern: "NoSuchElementException"
        description: "UI element not found"
        fix: "Update locator or add wait"
      - pattern: "ElementClickInterceptedException"
        description: "Cannot click element"
        fix: "Add scroll or wait for overlay"
      - pattern: "ElementNotInteractableException"
        description: "Element not interactable"
        fix: "Wait for element to be ready"

      # Test logic issues
      - pattern: "AssertionError.*expected.*None"
        description: "Bad assertion in test"
        fix: "Fix test assertion"
      - pattern: "KeyError.*test"
        description: "Missing key in test data"
        fix: "Fix test data handling"
      - pattern: "AttributeError.*'NoneType'"
        description: "Test accessing None object"
        fix: "Add null check"

      # opendatahub-tests specific patterns
      - pattern: "validate_metrics_field.*timeout"
        description: "Metrics validation timeout in utilities/monitoring.py"
        fix: "Increase timeout for Prometheus scrape interval"
      - pattern: "wait_for_inference_service.*timeout"
        description: "InferenceService wait timeout"
        fix: "Model deployment can take 2-5 minutes"
      - pattern: "wait_for_notebook.*timeout"
        description: "Notebook startup timeout"
        fix: "Notebooks can take 3-5 minutes with image pull"
      - pattern: "wait_for_dsci.*timeout"
        description: "DSCI initialization timeout"
        fix: "DSCI can take several minutes"
      - pattern: "wait_for_dsc.*timeout"
        description: "DSC creation timeout"
        fix: "DSC can take several minutes"

    keywords:
      high_weight:
        - "test timeout"
        - "wait_timeout"
        - "polling failed"
        - "retry exhausted"
        - "max retries exceeded"
        - "fixture error"
        - "hardcoded"
      medium_weight:
        - "assertion"
        - "expected"
        - "actual"
        - "timeout"
        - "wait"

    # opendatahub-tests utilities timeout patterns
    timeout_patterns:
      - pattern: "240.*seconds"
        suggested_increase: 360
        description: "4 min timeout too short for metrics"
      - pattern: "120.*seconds"
        suggested_increase: 240
        description: "2 min timeout may be insufficient"
      - pattern: "60.*seconds"
        suggested_increase: 120
        description: "1 min timeout often too aggressive"

  # ===========================================================================
  # SYSTEM ISSUE - Infrastructure/External Service Issues
  # ===========================================================================
  system_issue:
    description: "Infrastructure, external services, or environment issues"
    priority: 3

    definitive_patterns:
      # =========================================
      # S3/Object Storage Authentication Issues
      # =========================================
      - pattern: "S3.*[Aa]uth"
        description: "S3 authentication failure"
        category: "external_service"
      - pattern: "S3.*[Cc]redential"
        description: "S3 credential issue"
        category: "external_service"
      - pattern: "S3.*[Aa]ccess.*[Dd]enied"
        description: "S3 access denied"
        category: "external_service"
      - pattern: "InvalidAccessKeyId"
        description: "Invalid S3 access key"
        category: "external_service"
      - pattern: "SignatureDoesNotMatch"
        description: "S3 signature mismatch"
        category: "external_service"
      - pattern: "NoSuchBucket"
        description: "S3 bucket not found"
        category: "external_service"
      - pattern: "AccessDenied.*S3|S3.*AccessDenied"
        description: "S3 access denied"
        category: "external_service"
      - pattern: "botocore.*[Ee]rror"
        description: "AWS/S3 SDK error"
        category: "external_service"
      - pattern: "aws.*credential"
        description: "AWS credential issue"
        category: "external_service"
      - pattern: "minio.*[Ee]rror"
        description: "MinIO storage error"
        category: "external_service"
      - pattern: "ObjectStorage.*[Ff]ailed"
        description: "Object storage failure"
        category: "external_service"

      # =========================================
      # Model Storage/Download Issues (Storage Initializer)
      # =========================================
      - pattern: "storage-initializer.*exit.*code"
        description: "Storage initializer failed - likely credential issue"
        category: "external_service"
      - pattern: "storage-initializer.*[Ff]ailed"
        description: "Model storage initializer failure"
        category: "external_service"
      - pattern: "model.*download.*[Ff]ailed|[Ff]ailed.*download.*model"
        description: "Model download from storage failed"
        category: "external_service"
      - pattern: "Unable.*to.*fetch.*model"
        description: "Cannot fetch model from storage"
        category: "external_service"
      - pattern: "kserve-storage-initializer.*error|kserve-storage-initializer.*exit"
        description: "KServe storage initializer failed"
        category: "external_service"
      - pattern: "model.*pull.*[Ff]ailed|[Ff]ailed.*pull.*model"
        description: "Model pull failed"
        category: "external_service"
      - pattern: "init.*container.*[Ff]ailed.*storage"
        description: "Storage init container failed"
        category: "external_service"
      - pattern: "ExpiredToken|ExpiredTokenException"
        description: "AWS token expired"
        category: "external_service"
      - pattern: "CredentialsError|CredentialNotFound"
        description: "Storage credentials error"
        category: "external_service"
      - pattern: "SecretNotFound.*s3|s3.*SecretNotFound"
        description: "S3 secret not found"
        category: "external_service"

      # =========================================
      # Network/Connectivity Issues
      # =========================================
      - pattern: "network.*unreachable"
        description: "Network connectivity issue"
        category: "infrastructure"
      - pattern: "DNS.*resolution.*failed"
        description: "DNS lookup failure"
        category: "infrastructure"
      - pattern: "connection.*reset.*peer"
        description: "Network connection reset"
        category: "infrastructure"
      - pattern: "connection.*refused"
        description: "Connection refused"
        category: "infrastructure"
      - pattern: "connection.*timed.*out"
        description: "Connection timeout"
        category: "infrastructure"

      # =========================================
      # Kubernetes/OpenShift Infrastructure
      # =========================================
      - pattern: "ETCD.*timeout"
        description: "etcd cluster issue"
        category: "infrastructure"
      - pattern: "API.*server.*unavailable"
        description: "Kubernetes API server issue"
        category: "infrastructure"
      - pattern: "node.*NotReady"
        description: "Cluster node issue"
        category: "infrastructure"
      - pattern: "PersistentVolumeClaim.*Pending"
        description: "Storage provisioning issue"
        category: "infrastructure"
      - pattern: "FailedScheduling"
        description: "Pod scheduling failure"
        category: "infrastructure"
      - pattern: "Insufficient.*cpu|Insufficient.*memory"
        description: "Cluster resource exhaustion"
        category: "infrastructure"
      - pattern: "quota.*exceeded"
        description: "Resource quota hit"
        category: "infrastructure"

      # =========================================
      # Container Registry Issues
      # =========================================
      - pattern: "ImagePullBackOff"
        description: "Cannot pull container image"
        category: "external_service"
      - pattern: "ErrImagePull"
        description: "Image pull error"
        category: "external_service"
      - pattern: "image.*pull.*rate.*limit"
        description: "Registry rate limit"
        category: "external_service"
      - pattern: "quay\\.io.*timeout"
        description: "Quay.io registry timeout"
        category: "external_service"
      - pattern: "registry.*timeout"
        description: "Container registry timeout"
        category: "external_service"
      - pattern: "unauthorized.*registry"
        description: "Registry authentication failure"
        category: "external_service"

      # =========================================
      # GPU/Hardware Issues
      # =========================================
      - pattern: "GPU.*not.*available"
        description: "GPU resource unavailable"
        category: "infrastructure"
      - pattern: "nvidia.*driver"
        description: "NVIDIA driver issue"
        category: "infrastructure"
      - pattern: "CUDA.*error"
        description: "CUDA error"
        category: "infrastructure"
      - pattern: "cuda.*out.*of.*memory"
        description: "GPU memory exhausted"
        category: "infrastructure"

      # =========================================
      # External Service Issues
      # =========================================
      - pattern: "rate.*limit"
        description: "API rate limiting"
        category: "external_service"
      - pattern: "503.*[Ss]ervice.*[Uu]navailable"
        description: "External service unavailable"
        category: "external_service"
      - pattern: "502.*[Bb]ad.*[Gg]ateway"
        description: "Bad gateway - upstream issue"
        category: "external_service"
      - pattern: "504.*[Gg]ateway.*[Tt]imeout"
        description: "Gateway timeout"
        category: "external_service"

      # =========================================
      # Certificate/TLS Issues
      # =========================================
      - pattern: "certificate.*expired"
        description: "SSL certificate expired"
        category: "infrastructure"
      - pattern: "certificate.*verify.*failed"
        description: "SSL certificate verification failed"
        category: "infrastructure"
      - pattern: "SSL.*handshake.*failed"
        description: "SSL handshake failure"
        category: "infrastructure"

    keywords:
      high_weight:
        - "cluster instability"
        - "node failure"
        - "network partition"
        - "storage unavailable"
        - "resource exhaustion"
        - "infrastructure"
        - "S3 error"
        - "bucket"
        - "AWS"
        - "MinIO"
        - "credential"
        - "access key"
        - "secret key"
        - "storage-initializer"
        - "model download"
        - "model pull"
        - "AccessDenied"
        - "InvalidAccessKeyId"
      medium_weight:
        - "flaky"
        - "transient"
        - "intermittent"
        - "sporadic"
        - "environment"
        - "init container"
        - "fetch model"

    # Flakiness detection
    flakiness_rules:
      pass_rate_range:
        min: 20
        max: 80
        requires: "no_definitive_pattern"
        description: "Pass rate suggests flakiness but check error first"
      consecutive_failures:
        threshold: 5
        override: "likely_not_flaky"
        description: "5+ consecutive failures = real issue"

  # ===========================================================================
  # NO DEFECT - Expected behavior
  # ===========================================================================
  no_defect:
    description: "Not a defect - expected behavior or intentional skip"
    priority: 4

    definitive_patterns:
      - pattern: "skip.*known.*issue"
        description: "Intentionally skipped"
      - pattern: "xfail"
        description: "Expected failure (pytest xfail)"
      - pattern: "not.*supported.*platform"
        description: "Platform not supported"
      - pattern: "feature.*disabled"
        description: "Feature intentionally disabled"
      - pattern: "pytest\\.mark\\.skip"
        description: "Pytest skip marker"

# -----------------------------------------------------------------------------
# Severity Rules
# -----------------------------------------------------------------------------
severity_rules:
  critical:
    patterns:
      - "data.*loss"
      - "security.*breach"
      - "crash.*loop"
      - "cluster.*down"
      - "complete.*outage"
    description: "Immediate attention required"

  high:
    patterns:
      - "service.*unavailable"
      - "deployment.*failed"
      - "authentication.*failed"
      - "blocking"
      - "regression"
    description: "Should be fixed soon"

  medium:
    patterns:
      - "timeout"
      - "slow"
      - "degraded"
      - "warning"
    description: "Should be addressed"

  low:
    patterns:
      - "cosmetic"
      - "minor"
      - "enhancement"
    description: "Can be deferred"

# -----------------------------------------------------------------------------
# Component-Specific Rules (opendatahub-tests components)
# -----------------------------------------------------------------------------
component_rules:
  Model_server:
    description: "Model Serving - KServe, ModelMesh, OVMS, vLLM, TGI"
    extra_patterns:
      product_bug:
        - "inference.*failed"
        - "model.*not.*loaded"
        - "ServingRuntime.*error"
        - "predictor.*failed"
        - "transformer.*error"
      automation_bug:
        - "wait.*model.*ready"
        - "inference.*timeout"
        - "metrics.*timeout"
      system_issue:
        - "S3.*auth"
        - "model.*download.*failed"

  Dashboard:
    description: "RHOAI Dashboard UI"
    extra_patterns:
      automation_bug:
        - "element.*not.*visible"
        - "page.*load.*timeout"
        - "click.*intercepted"
        - "Selenium"
        - "Playwright"

  Pipelines:
    description: "Data Science Pipelines (DSP)"
    extra_patterns:
      product_bug:
        - "pipeline.*controller.*error"
        - "argo.*workflow.*failed"
        - "tekton.*error"
      system_issue:
        - "S3.*connection"
        - "artifact.*storage"

  Notebooks:
    description: "Jupyter Notebooks / Workbenches"
    extra_patterns:
      product_bug:
        - "notebook.*spawn.*failed"
        - "kernel.*died"
        - "JupyterHub.*error"
      automation_bug:
        - "notebook.*start.*timeout"
        - "kernel.*startup.*timeout"

  Operator:
    description: "RHOAI/ODH Operator"
    extra_patterns:
      product_bug:
        - "reconcile.*error"
        - "CRD.*not.*found"
        - "webhook.*failed"
        - "subscription.*error"

  Model_registry:
    description: "Model Registry"
    extra_patterns:
      product_bug:
        - "registry.*error"
        - "model.*registration.*failed"
      system_issue:
        - "database.*connection"
        - "postgres.*error"

  Trustyai:
    description: "TrustyAI Explainability"
    extra_patterns:
      product_bug:
        - "trustyai.*service.*error"
        - "explanation.*failed"

  Kueue:
    description: "Kueue Batch Scheduling"
    extra_patterns:
      product_bug:
        - "workload.*admission.*failed"
        - "queue.*error"

  Training:
    description: "Distributed Training (KubeRay, PyTorchJob)"
    extra_patterns:
      product_bug:
        - "training.*job.*failed"
        - "ray.*cluster.*error"
        - "pytorch.*job.*error"
      system_issue:
        - "GPU.*allocation"
        - "resource.*insufficient"

# -----------------------------------------------------------------------------
# Custom Rules (Add your own patterns here)
# -----------------------------------------------------------------------------
custom_rules:
  # Example:
  # my_custom_pattern:
  #   classification: "system_issue"
  #   pattern: "my.*specific.*error"
  #   description: "My specific error type"
  #   severity: "medium"

# -----------------------------------------------------------------------------
# Analysis Settings
# -----------------------------------------------------------------------------
settings:
  min_confidence: 0.7

  weights:
    definitive_pattern: 1.0
    high_keyword: 0.3
    medium_keyword: 0.15
    low_keyword: 0.05
    history_flaky: 0.2
    component_match: 0.1

  pass_rate:
    definitely_broken: 10
    possibly_flaky_min: 20
    possibly_flaky_max: 80
    mostly_passing: 90

  features:
    use_history: true
    use_component_rules: true
    use_severity_rules: true
    log_decisions: false
