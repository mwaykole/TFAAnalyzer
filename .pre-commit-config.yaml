# Pre-commit configuration for TFA
# Install with: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Code formatting
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        language_version: python3.11
        args: ["--line-length=100"]

  # Import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile=black", "--line-length=100"]

  # Linting
  - repo: https://github.com/astral-sh/ruff
    rev: v0.4.4
    hooks:
      - id: ruff
        args: ["--fix"]

  # Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies: [types-PyYAML, types-aiofiles]
        args: ["--ignore-missing-imports", "--no-strict-optional"]
        exclude: "tests/"

  # Duplicate code detection with CPD (Copy/Paste Detector)
  - repo: local
    hooks:
      - id: check-duplicate-code
        name: Check for duplicate code
        entry: python scripts/check_duplicates.py
        language: python
        types: [python]
        pass_filenames: false
        always_run: true

      - id: check-deprecated-imports
        name: Check for deprecated module imports
        entry: python scripts/check_deprecated_imports.py
        language: python
        types: [python]
        pass_filenames: false
        always_run: true

  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ["--branch=main", "--branch=master"]

  # Security checks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
        exclude: "tests/"
